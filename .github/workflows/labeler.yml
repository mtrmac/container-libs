# https://github.com/actions/labeler
name: "Pull Request Labeler"

# The triage job below sets the permissions it actually needs.
permissions: {}

on:
- pull_request_target

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
